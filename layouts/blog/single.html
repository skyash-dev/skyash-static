{{ define "main" }}
<article class="blog-post">
  <header>
    <h1 class="post-title">{{ .Title }}</h1>
    {{ if .Params.icon }}<span class="post-icon">{{ .Params.icon }}</span>{{ end }}
    {{ if .Params.category }}<span class="post-category">{{ .Params.category }}</span>{{ end }}
    <time class="post-date">{{ .Date.Format "January 2, 2006" }}</time>
  </header>

  <div class="post-content">
    {{ .Content }}
  </div>
</article>
{{ end }}
